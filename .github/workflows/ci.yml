name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch keeps only its newest run. On main the runs queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash -eo pipefail: a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --all-packages
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --all-packages --python ${{ matrix.python-version }}
      - run: uv run --frozen pytest -q

  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: snodra/snodra-server
          ref: ${{ vars.SNODRA_SERVER_REF || 'main' }}
          path: snodra-server
      - run: bash scripts/check-proto-sync.sh
        env:
          SNODRA_PROTO_SOURCE: ${{ github.workspace }}/snodra-server/proto/hub.proto
          SNODRA_PROTO_SYNC_REQUIRED: "true"

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: bash scripts/gen-proto.sh
      - run: git diff --exit-code packages/snodra-messaging/src/snodra/_hubpb

  build:
    runs-on: ubuntu-latest
    env:
      # The distributions this repository publishes, one per line; the examples are never built
      # here, and the level-2 add-ons wait for their PyPI pending trusted publishers. The release
      # check (scripts/release-check.sh) builds exactly this list.
      PUBLISHED: |
        snodra-messaging
        snodra-messaging-observability
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --all-packages
      - run: |
          rm -rf dist
          for package in $PUBLISHED; do
            uv build --package "$package" --out-dir dist
          done
      - run: uv run --frozen twine check --strict dist/*
      - run: uv venv -p 3.12 "$RUNNER_TEMP/v"
      - run: uv pip install --python "$RUNNER_TEMP/v" dist/*.whl
      - run: >-
          "$RUNNER_TEMP/v/bin/python" -c
          "import snodra, snodra._hubpb.hub_pb2_grpc; print(snodra.__version__)"

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNODRA_CONFORMANCE_VERSION: v0.4.1
      SNODRA_SERVER_VERSION: ${{ vars.SNODRA_SERVER_VERSION || '0.6.0' }}
      SNODRA_CONFORMANCE_REPORT_DIR: ${{ github.workspace }}/conformance-reports
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --all-packages --python 3.13

      - name: Fetch the conformance runner
        run: |
          archive="snodra-conformance-${SNODRA_CONFORMANCE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$RUNNER_TEMP/runner"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/snodra/snodra-conformance/releases/download/${SNODRA_CONFORMANCE_VERSION}/${archive}"
          # The sha256 pinned for every platform, shared with scripts/conformance.sh.
          sha256="$(awk -v a="$archive" '$2 == a { print $1 }' scripts/conformance-runner.sha256)"
          test -n "$sha256"
          echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/runner"
          test -x "$RUNNER_TEMP/runner/snodra-conformance"
          "$RUNNER_TEMP/runner/snodra-conformance" --version
          echo "SNODRA_CONFORMANCE_BIN=$RUNNER_TEMP/runner/snodra-conformance" >> "$GITHUB_ENV"

      - name: Pull the hub image
        run: docker pull "snodra/snodra-server:${SNODRA_SERVER_VERSION}"

      - name: Level 1, every check
        run: |
          mkdir -p "$SNODRA_CONFORMANCE_REPORT_DIR"
          SNODRA_CONFORMANCE_REPORT="$SNODRA_CONFORMANCE_REPORT_DIR/level-1.json" \
            scripts/conformance.sh --report json
          # Exit 0 is not enough: a check the runner skipped does not fail it.
          jq -e '.passed == true and .complete == true and .level_reached == 1
                 and ([.checks[]] | length == 33)
                 and ([.checks[] | select(.status != "PASS")] | length == 0)' \
            "$SNODRA_CONFORMANCE_REPORT_DIR/level-1.json" >/dev/null \
            || { jq -r '.checks[] | select(.status != "PASS") | .id + " " + .status + " " + .detail' \
                   "$SNODRA_CONFORMANCE_REPORT_DIR/level-1.json"; \
                 echo "level 1 was not reached, or a check did not pass"; exit 1; }

      - name: Level 1, the two-hub check against two real hubs
        run: |
          mkdir -p "$SNODRA_CONFORMANCE_REPORT_DIR"
          SNODRA_CONFORMANCE_REPORT="$SNODRA_CONFORMANCE_REPORT_DIR/l1-hubs.json" \
            scripts/conformance.sh --hubs 2 --only L1-HUBS --report json
          jq -e '[.checks[] | select(.id == "L1-HUBS" and .status == "PASS"
                                     and (.detail | contains("registered on both real hubs")))] | length == 1' \
            "$SNODRA_CONFORMANCE_REPORT_DIR/l1-hubs.json" >/dev/null \
            || { jq -r '.checks[] | .id + " " + .status + " " + .detail' \
                   "$SNODRA_CONFORMANCE_REPORT_DIR/l1-hubs.json"; \
                 echo "L1-HUBS did not register on both real hubs"; exit 1; }

      - name: Keep the runner's reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-reports
          path: conformance-reports/
          if-no-files-found: warn

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # release.test.sh builds the wheels, installs them and runs the tests on both.
      - run: uv python install 3.12 3.14
      - run: for t in scripts/*.test.sh; do sh "$t" || exit 1; done

  # Versions are cut here, from the Conventional Commit subjects since the last tag
  # (scripts/next-version.sh): feat -> minor, fix/perf -> patch, anything else -> no release.
  # Below 1.0.0 nothing computes a major; 1.0.0 is declared by hand. A release is one commit and one
  # tag, vX.Y.Z, for both distributions.
  #
  # Three jobs, so that no code that builds or tests ever holds a token that can push:
  # - version (read-only) computes the version, makes the release commit and its tag, records their
  #   ids and hands them over as a git bundle;
  # - package (read-only) builds and checks exactly that commit, as a consumer gets it;
  # - push (contents: write) checks out nothing and runs no file of the repository: it checks that
  #   the bundle holds the recorded and tested objects, one commit on top of the tested main head,
  #   and pushes those ids.
  #
  # Then publish (one job per distribution, PyPI's trusted publisher, no write token) uploads the
  # files the package job tested, and release creates the GitHub release.
  version:
    needs: [lint, test, proto-sync, generated, build, conformance, scripts]
    # Pushes to main of this repository only: never a fork or a pull request, and never the
    # release commit itself (a GITHUB_TOKEN push starts no workflow anyway).
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository_owner == 'snodra'
      && !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
      tag_id: ${{ steps.commit.outputs.tag_id }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: next version
        id: next
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $main, not $GITHUB_SHA: a newer push releases it, or this is a re-run of a run that released. Nothing to do. To finish a failed release, re-run its failed jobs or run the release workflow with the tag."
            exit 0
          fi
          last=$(git tag --merged HEAD --list 'v*' | scripts/last-tag.sh)
          range=${last:+$last..}HEAD
          version=$(
            { git log --format=%s "$range"
              git log -E --grep='^BREAKING[ -]CHANGE:' --format='BREAKING CHANGE: %h' "$range"
            } | scripts/next-version.sh "$last"
          )
          echo "last tag: ${last:-none}; next version: ${version:-none, no release}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: commit and tag
        id: commit
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/bump-version.sh "$VERSION"
          git add -u
          git commit -m "release: $VERSION"
          git tag -a "v$VERSION" -m "${GITHUB_REPOSITORY#*/} v$VERSION"
          v="refs/tags/v$VERSION"
          { echo "commit=$(git rev-parse HEAD)"
            echo "tag_id=$(git rev-parse "$v")"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/release"
          git bundle create "$RUNNER_TEMP/release/release.bundle" "$v"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.next.outputs.version != ''
        with:
          name: release
          path: ${{ runner.temp }}/release/release.bundle
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # The packaging check: the release commit must build the four files, install them and pass the
  # tests before anything is pushed, because PyPI keeps a published version forever
  # (scripts/release-check.sh).
  package:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      sums: ${{ steps.check.outputs.sums }}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: the release commit, as recorded
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          TAG_ID: ${{ needs.version.outputs.tag_id }}
        run: |
          v="refs/tags/v$VERSION"
          git fetch -q "$RUNNER_TEMP/release/release.bundle" "$v:$v"
          if [ "$(git rev-parse "$v")" != "$TAG_ID" ] || [ "$(git rev-parse "$v^{commit}")" != "$COMMIT" ]; then
            echo "::error::the bundle does not hold the release the version job recorded"
            exit 1
          fi
          git checkout -q --detach "$COMMIT"

      - name: the release commit packages
        id: check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts/release-check.sh "$VERSION"
          { echo "commit=$(git rev-parse HEAD)"
            echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  push:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      # No checkout: nothing of the repository is built or run with this job's token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: push
        id: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          TAG_ID: ${{ needs.version.outputs.tag_id }}
          TESTED: ${{ needs.package.outputs.commit }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # git settings go through the environment: hooks off, and later the token, which so
          # never appears on a command line.
          config() {
            n=${GIT_CONFIG_COUNT:-0}
            export GIT_CONFIG_COUNT=$((n + 1)) "GIT_CONFIG_KEY_$n=$1" "GIT_CONFIG_VALUE_$n=$2"
          }
          config core.hooksPath /dev/null
          git init -q --bare "$RUNNER_TEMP/release.git"
          cd "$RUNNER_TEMP/release.git"
          v="refs/tags/v$VERSION"
          git fetch -q "$RUNNER_TEMP/release/release.bundle" "$v:$v"
          # Object ids are content hashes: these are the objects recorded, and the commit tested.
          if [ "$(git rev-parse "$v")" != "$TAG_ID" ] \
             || [ "$(git rev-parse "$v^{commit}")" != "$COMMIT" ] || [ "$COMMIT" != "$TESTED" ]; then
            echo "::error::the release objects are not the ones recorded and tested"
            exit 1
          fi
          if [ "$(git rev-list --parents -n 1 "$COMMIT")" != "$COMMIT $GITHUB_SHA" ]; then
            echo "::error::the release commit is not one commit on top of the tested main head"
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          # The commit and the tag, or none of them, and only as a fast-forward of the tested main
          # head.
          if ! git push --atomic "$remote" "$COMMIT:refs/heads/main" "$TAG_ID:$v"; then
            main=$(git ls-remote --exit-code "$remote" refs/heads/main | cut -f1)
            if [ "$main" = "$COMMIT" ]; then
              # The push landed and only the client saw an error: release it.
              git ls-remote --exit-code "$remote" "$v" >/dev/null \
                || { echo "::error::main has the release commit but not v$VERSION"; exit 1; }
              echo "::warning::git reported an error, but the release commit and v$VERSION are on the remote"
            elif [ "$main" != "$GITHUB_SHA" ]; then
              echo "::notice::main moved during the release; the run for the newer commit releases"
              exit 0
            else
              echo "::error::the push to main was refused: check that github-actions may push to main and create tags"
              exit 1
            fi
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # PyPI keeps a version forever, and each distribution has its own trusted publisher: one job per
  # distribution, each with the environment the publisher names. Neither checks out the repository.
  publish-core:
    needs: [package, push]
    if: needs.push.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: the files are the ones tested
        env:
          TAG: ${{ needs.push.outputs.tag }}
          SUMS: ${{ needs.package.outputs.sums }}
        run: |
          version=${TAG#v}
          cd dist
          if [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" != "$SUMS" ]; then
            echo "::error::dist/SHA256SUMS is not the one the package job recorded"
            exit 1
          fi
          sha256sum --check SHA256SUMS
          for f in "snodra_messaging-$version.tar.gz" "snodra_messaging-$version-py3-none-any.whl"; do
            [ -f "$f" ] || { echo "::error::dist/$f is missing"; exit 1; }
          done
          mkdir core
          mv "snodra_messaging-$version.tar.gz" "snodra_messaging-$version-py3-none-any.whl" core/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/core/
          skip-existing: true

  publish-observability:
    needs: [package, push]
    if: needs.push.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi-observability
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: the files are the ones tested
        env:
          TAG: ${{ needs.push.outputs.tag }}
          SUMS: ${{ needs.package.outputs.sums }}
        run: |
          version=${TAG#v}
          cd dist
          if [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" != "$SUMS" ]; then
            echo "::error::dist/SHA256SUMS is not the one the package job recorded"
            exit 1
          fi
          sha256sum --check SHA256SUMS
          for f in "snodra_messaging_observability-$version.tar.gz" "snodra_messaging_observability-$version-py3-none-any.whl"; do
            [ -f "$f" ] || { echo "::error::dist/$f is missing"; exit 1; }
          done
          mkdir observability
          mv "snodra_messaging_observability-$version.tar.gz" \
            "snodra_messaging_observability-$version-py3-none-any.whl" observability/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/observability/
          skip-existing: true

  # A tag pushed with GITHUB_TOKEN starts no workflow, so the release runs here, once PyPI has both
  # distributions.
  release:
    needs: [push, publish-core, publish-observability]
    if: needs.push.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.push.outputs.tag }}

