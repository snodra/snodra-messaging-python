[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "snodra-messaging-observability"
version = "0.0.0"
description = "OpenTelemetry instrumentation for the Snodra messaging suite."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "snodra-messaging==0.0.0",
    "opentelemetry-api>=1.45,<2",
]

[project.urls]
Homepage = "https://snodra.damoreira.com/"
Repository = "https://github.com/snodra/snodra-messaging-python"

[tool.uv.sources]
snodra-messaging = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/snodra_observability"]
