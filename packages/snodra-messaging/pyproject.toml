[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "snodra-messaging"
version = "0.6.0"
description = "Official Python client library of the Snodra messaging suite."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "grpcio>=1.85.4,<2",
    "protobuf>=7.35.1,<8",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://snodra.damoreira.com/"
Repository = "https://github.com/snodra/snodra-messaging-python"

[tool.hatch.build.targets.wheel]
packages = ["src/snodra"]
