[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "store-interop"
version = "0.0.0"
description = "The stores interoperability probe service; not published."
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "snodra-messaging",
    "snodra-messaging-kafka",
    "snodra-messaging-mongo",
    "snodra-messaging-rabbitmq",
    "snodra-messaging-sql",
]

[tool.uv.sources]
snodra-messaging = { workspace = true }
snodra-messaging-kafka = { workspace = true }
snodra-messaging-mongo = { workspace = true }
snodra-messaging-rabbitmq = { workspace = true }
snodra-messaging-sql = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/store_interop"]
